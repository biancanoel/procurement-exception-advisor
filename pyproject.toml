[project]
name = "procurement-exception-advisor"
version = "0.1.0"
description = "Agentic decision support for emergency and sole-source procurement exceptions"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1,<2",
    "gradio>=6,<7",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "mcp>=2,<3",
    "openai>=2,<3",
    "pydantic>=2.7,<3.0",
    "pypdf>=6,<7",
    "python-dotenv>=1,<2",
]

[project.scripts]
ingest-santa-monica-policy = "rag.ingest:main"
index-santa-monica-policy = "rag.retriever:index_main"
index-procurement-policies = "rag.retriever:index_main"
query-procurement-policy = "rag.retriever:query_main"
ask-procurement-policy = "rag.answerer:main"
request-procurement-tool-call = "rag.tool_call_demo:main"
get-case-facts = "rag.case_tool_demo:main"
ask-procurement-graph = "graph.cli:main"
procurement-advisor-ui = "ui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
